name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/release-android.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publier automatiquement une Release GitHub'
        required: true
        type: boolean
        default: true
      tag_name:
        description: 'Nom du tag (ex: v1.0.0)'
        required: false
        type: string
        default: 'latest'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install Flutter Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Universal APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Build Split-per-ABI APKs
        run: |
          cd mobile
          flutter build apk --release --split-per-abi

      - name: Build AppBundle (AAB)
        run: |
          cd mobile
          flutter build appbundle --release

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-assets
          
          # Universal APK
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-assets/app-release.apk
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-assets/chillers-universal.apk
          
          # Split APKs
          if [ -f mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/app-arm64-v8a-release.apk
            cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/chillers-arm64-v8a.apk
          fi
          
          if [ -f mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-assets/app-armeabi-v7a-release.apk
          fi
          
          # AppBundle
          if [ -f mobile/build/app/outputs/bundle/release/app-release.aab ]; then
            cp mobile/build/app/outputs/bundle/release/app-release.aab release-assets/app-release.aab
          fi
          
          ls -la release-assets/

      - name: Upload Build Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Chillers-Android-Builds
          path: release-assets/
          retention-days: 30

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.create_release }}" == "true" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
            [ -z "$TAG" ] && TAG="latest"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        if: steps.release_tag.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Chillers Mobile ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: ${{ steps.release_tag.outputs.tag == 'latest' }}
          generate_release_notes: true
          files: |
            release-assets/app-release.apk
            release-assets/chillers-universal.apk
            release-assets/app-arm64-v8a-release.apk
            release-assets/chillers-arm64-v8a.apk
            release-assets/app-armeabi-v7a-release.apk
            release-assets/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
