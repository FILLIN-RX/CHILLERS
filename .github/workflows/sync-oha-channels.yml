name: Synchroniser les chaînes OHA vers MongoDB

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: sync-oha-channels
  cancel-in-progress: false

jobs:
  sync-oha-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances backend
        working-directory: backend
        run: npm ci

      - name: Récupérer les chaînes OHA et les enregistrer dans MongoDB
        working-directory: backend
        env:
          NODE_ENV: production
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: npx tsx src/modules/live/sync-oha-catalog.ts
