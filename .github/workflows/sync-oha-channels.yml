name: Synchroniser les chaînes OHA vers MongoDB

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode de synchronisation'
        required: true
        default: full
        type: choice
        options:
          - full
          - revalidate

concurrency:
  group: sync-oha-channels
  cancel-in-progress: false

jobs:
  sync-oha-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances backend
        working-directory: backend
        run: npm ci

      - name: Synchroniser ou revalider les chaînes OHA
        working-directory: backend
        env:
          NODE_ENV: production
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          if [ "${{ github.event.schedule }}" = "15 * * * *" ] || [ "${{ github.event.inputs.mode }}" = "revalidate" ]; then
            npx tsx src/modules/live/sync-oha-catalog.ts --revalidate
          else
            npx tsx src/modules/live/sync-oha-catalog.ts
          fi
