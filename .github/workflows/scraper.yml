name: Chiller Scraper & Maintenance

on:
  # Déclenchement automatique planifié tous les jours à 03h00 UTC
  schedule:
    - cron: '0 3 * * *'

  # Déclenchement manuel depuis l'interface GitHub (Actions > Run workflow)
  workflow_dispatch:
    inputs:
      task:
        description: 'Tâche à exécuter'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'films'
          - 'series'
          - 'animes'
          - 'maintenance'
          - 'link-tmdb'

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Installation des dépendances Backend
        run: |
          cd backend
          npm ci

      - name: Exécution du Scraping / Maintenance
        env:
          NODE_ENV: production
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          UQLOAD_API_KEY: ${{ secrets.UQLOAD_API_KEY }}
          DOODSTREAM_API_KEY: ${{ secrets.DOODSTREAM_API_KEY }}
          DOODSTREAM_USER: ${{ secrets.DOODSTREAM_USER }}
          STREAMTAPE_LOGIN: ${{ secrets.STREAMTAPE_LOGIN }}
          STREAMTAPE_KEY: ${{ secrets.STREAMTAPE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          cd backend
          TASK="${{ github.event.inputs.task || 'all' }}"
          echo "=== Lancement de la tâche : $TASK ==="

          case "$TASK" in
            "films")
              npx tsx src/scraping/core/scrape-films.ts
              ;;
            "series")
              npx tsx src/scraping/core/scrape-series.ts
              ;;
            "animes")
              npx tsx src/scraping/core/scrape-animes.ts
              ;;
            "maintenance")
              npx tsx src/scraping/maintenance/check-all-links.ts
              npx tsx src/scraping/maintenance/maintainer.ts || true
              ;;
            "link-tmdb")
              npx tsx src/scraping/maintenance/link-movies-tmdb.ts
              npx tsx src/scraping/maintenance/link-series-tmdb.ts
              ;;
            "all")
              echo "1/3 Scraping Films..."
              npx tsx src/scraping/core/scrape-films.ts
              echo "2/3 Scraping Séries..."
              npx tsx src/scraping/core/scrape-series.ts
              echo "3/3 Scraping Animes..."
              npx tsx src/scraping/core/scrape-animes.ts
              echo "Maintenance et Linking TMDB..."
              npx tsx src/scraping/maintenance/link-movies-tmdb.ts || true
              npx tsx src/scraping/maintenance/link-series-tmdb.ts || true
              ;;
            *)
              echo "Tâche inconnue : $TASK"
              exit 1
              ;;
          esac
