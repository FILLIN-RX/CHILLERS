name: Chiller Scraper & Maintenance

on:
  # Scraping + Maintenance quotidien à 03h00 UTC
  schedule:
    - cron: '0 3 * * *'

  # Déclenchement manuel depuis l'interface GitHub
  workflow_dispatch:
    inputs:
      task:
        description: 'Tâche à exécuter'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'films'
          - 'series'
          - 'animes'
          - 'maintenance'
          - 'link-tmdb'
          - 'realign'
          - 'keepalive'
          - 'deploy-migration'
          - 'catalog'
          - 'catalog-full'
          - 'catalog-match'
          - 'catalog-unmatched'
          - 'catalog-oha'
      apply:
        description: 'realign : écrire les tmdbId corrigés en base (sinon dry-run, lecture seule)'
        required: false
        default: false
        type: boolean

# Deux jobs qui écrivent dans le même Atlas en même temps se marchent dessus.
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape-and-maintenance:
    runs-on: ubuntu-latest
    # Le parcours complet du catalogue (21 151 films + les séries) tourne à
    # ~500 fiches/minute côté TMDB : 60 minutes coupe le job en plein writes.
    timeout-minutes: 180

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Installation des dépendances Backend
        run: |
          cd backend
          npm ci

      # Le job a été silencieusement mort pendant des semaines : les chemins
      # pointaient sur src/scraping/** (le code est dans src/modules/scraping/**)
      # et chaque ligne portait un `|| true` qui avalait l'erreur. Ce garde-fou
      # échoue à la place de passer quand un script bouge.
      - name: Vérification des chemins de scripts
        working-directory: backend
        run: |
          for f in \
            src/modules/scraping/core/scrape-films.js \
            src/modules/scraping/core/scrape-series.ts \
            src/modules/scraping/core/scrape-animes.ts \
            src/modules/scraping/core/scrape-w16-animes.ts \
            src/modules/scraping/maintenance/link-movies-tmdb.ts \
            src/modules/scraping/maintenance/link-series-tmdb.ts \
            src/modules/scraping/maintenance/check-all-links.ts \
            src/modules/scraping/maintenance/maintainer.ts \
            src/modules/scraping/maintenance/organize-series.ts \
            src/modules/scraping/maintenance/sync-series-to-mongo.ts \
            src/modules/scraping/maintenance/realign-tmdb-links.ts \
            scripts/backfill-uqload-links.ts \
            src/scripts/migrate-dood-to-uqload.ts \
            src/scripts/upload-uqload.ts \
            src/modules/catalog/sync-frenchstream.ts \
            src/modules/catalog/sync-otaku.ts \
            src/modules/catalog/sync-afroland.ts \
            src/modules/catalog/match-tmdb.ts \
            src/modules/live/sync-oha-catalog.ts
          do
            test -f "$f" || { echo "::error::script manquant : $f"; exit 1; }
          done
          echo "Tous les scripts référencés sont présents."

      - name: Scraping & Maintenance
        env:
          NODE_ENV: production
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          UQLOAD_API_KEY: ${{ secrets.UQLOAD_API_KEY }}
          DOODSTREAM_API_KEY: ${{ secrets.DOODSTREAM_API_KEY }}
          DOODSTREAM_USER: ${{ secrets.DOODSTREAM_USER }}
          STREAMTAPE_LOGIN: ${{ secrets.STREAMTAPE_LOGIN }}
          STREAMTAPE_KEY: ${{ secrets.STREAMTAPE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REALIGN_APPLY: ${{ github.event.inputs.apply == 'true' && '1' || '0' }}
          MATCH_BATCH_SIZE: '2000'
          MATCH_MAX_MINUTES: '45'
        run: |
          cd backend
          TASK="${{ github.event.inputs.task || 'all' }}"
          echo "=== Lancement de la tâche : $TASK ==="

          case "$TASK" in
            "films")
              npx tsx src/modules/scraping/core/scrape-films.js
              ;;
            "series")
              npx tsx src/modules/scraping/core/scrape-series.ts
              ;;
            "animes")
              npx tsx src/modules/scraping/core/scrape-animes.ts
              npx tsx src/modules/scraping/core/scrape-w16-animes.ts
              ;;
            "maintenance")
              echo "1/4 Vérification des liens morts..."
              npx tsx src/modules/scraping/maintenance/check-all-links.ts || true
              echo "2/4 Maintenance liens séries..."
              npx tsx src/modules/scraping/maintenance/maintainer.ts || true
              echo "3/4 Organize séries Doodstream..."
              npx tsx src/modules/scraping/maintenance/organize-series.ts || true
              echo "4/4 Sync séries vers MongoDB..."
              npx tsx src/modules/scraping/maintenance/sync-series-to-mongo.ts || true
              ;;
            "link-tmdb")
              npx tsx src/modules/scraping/maintenance/link-movies-tmdb.ts
              npx tsx src/modules/scraping/maintenance/link-series-tmdb.ts
              ;;
            "realign")
              # Réaligne les fiches dont le tmdbId ou le fichier désigne une
              # autre œuvre. Écrit seulement si apply a été coché au dispatch.
              if [ "$REALIGN_APPLY" = "1" ]; then
                npx tsx src/modules/scraping/maintenance/realign-tmdb-links.ts --apply
              else
                npx tsx src/modules/scraping/maintenance/realign-tmdb-links.ts
              fi
              ;;
            "keepalive")
              # Les liens Uqload stockés sont signés et expirent : seule une
              # re-mint par fileCode les ressuscite.
              npx tsx scripts/backfill-uqload-links.ts
              ;;
            "deploy-migration")
              echo "Migration DoodStream → Uqload..."
              npx tsx src/scripts/migrate-dood-to-uqload.ts || true
              npx tsx src/scripts/upload-uqload.ts --verify || true
              ;;
            "catalog")
              # Index provider incrémental : nouvelles fiches côté FrenchStream
              # (les premières pages de l'archive = les ajouts récents) +
              # French-Manga, puis liage TMDB et épisodes W16 confirmés.
              CATALOG_SYNC_MODE=update npx tsx src/modules/catalog/sync-frenchstream.ts
              npx tsx src/modules/catalog/sync-otaku.ts
              npx tsx src/modules/catalog/sync-afroland.ts
              npx tsx src/modules/catalog/match-tmdb.ts
              npx tsx src/modules/scraping/core/scrape-w16-animes.ts
              ;;
            "catalog-full")
              # Parcours entier de l'archive (21 151 films + les séries). À ne
              # lancer qu'une fois, puis en update quotidien.
              CATALOG_SYNC_MODE=full npx tsx src/modules/catalog/sync-frenchstream.ts
              npx tsx src/modules/catalog/sync-otaku.ts
              npx tsx src/modules/catalog/sync-afroland.ts
              npx tsx src/modules/catalog/match-tmdb.ts
              npx tsx src/modules/scraping/core/scrape-w16-animes.ts
              ;;
            "catalog-match")
              npx tsx src/modules/catalog/match-tmdb.ts
              ;;
            "catalog-unmatched")
              MATCH_UNMATCHED=1 MATCH_PROVIDER=frenchstream MATCH_CATALOG_TYPE=tv MATCH_BATCH_SIZE=3000 MATCH_MAX_MINUTES=45 MATCH_RETRY_DAYS=30 npx tsx src/modules/catalog/match-tmdb.ts
              ;;
            "catalog-oha")
              npx tsx src/modules/live/sync-oha-catalog.ts
              ;;
            "all")
              echo "=== 1/10 Scraping Films ==="
              npx tsx src/modules/scraping/core/scrape-films.js
              echo "=== 2/10 Scraping Séries ==="
              npx tsx src/modules/scraping/core/scrape-series.ts
              echo "=== 3/10 Scraping Animes ==="
              npx tsx src/modules/scraping/core/scrape-animes.ts
              npx tsx src/modules/scraping/core/scrape-w16-animes.ts
              echo "=== 4/10 Linking TMDB ==="
              npx tsx src/modules/scraping/maintenance/link-movies-tmdb.ts || true
              npx tsx src/modules/scraping/maintenance/link-series-tmdb.ts || true
              echo "=== 5/10 Réalignement des fiches (lecture seule) ==="
              if [ "$REALIGN_APPLY" = "1" ]; then
                npx tsx src/modules/scraping/maintenance/realign-tmdb-links.ts --apply || true
              else
                npx tsx src/modules/scraping/maintenance/realign-tmdb-links.ts || true
              fi
              echo "=== 6/10 Vérification liens morts ==="
              npx tsx src/modules/scraping/maintenance/check-all-links.ts || true
              echo "=== 7/10 Maintenance liens séries ==="
              npx tsx src/modules/scraping/maintenance/maintainer.ts || true
              echo "=== 8/10 Organize + Sync séries ==="
              npx tsx src/modules/scraping/maintenance/organize-series.ts || true
              npx tsx src/modules/scraping/maintenance/sync-series-to-mongo.ts || true
              echo "=== 9/10 Index catalogue providers (incrémental) ==="
              CATALOG_SYNC_MODE=update npx tsx src/modules/catalog/sync-frenchstream.ts
              npx tsx src/modules/catalog/sync-otaku.ts
              npx tsx src/modules/catalog/sync-afroland.ts
              echo "=== 10/10 Liage catalogue → TMDB ==="
              npx tsx src/modules/catalog/match-tmdb.ts
              echo "=== 11/11 Reprise des séries FrenchStream non liées ==="
              MATCH_UNMATCHED=1 MATCH_PROVIDER=frenchstream MATCH_CATALOG_TYPE=tv MATCH_BATCH_SIZE=3000 MATCH_MAX_MINUTES=45 MATCH_RETRY_DAYS=30 npx tsx src/modules/catalog/match-tmdb.ts
              ;;
            *)
              echo "Tâche inconnue : $TASK"
              exit 1
              ;;
          esac

      - name: KeepAlive Uqload (dimanche uniquement)
        env:
          NODE_ENV: production
          MONGO_URI: ${{ secrets.MONGO_URI }}
          UQLOAD_API_KEY: ${{ secrets.UQLOAD_API_KEY }}
        run: |
          cd backend
          # En schedule, vérifier que c'est dimanche (jour 7)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DAY=$(date -u +%u)
            if [ "$DAY" != "7" ]; then
              echo "Pas dimanche (jour $DAY), skip keepalive."
              exit 0
            fi
          fi
          echo "=== KeepAlive Uqload : re-mint des liens signés expirés ==="
          npx tsx scripts/backfill-uqload-links.ts

      # Le rapport du correcteur est hors du repo : sans artefact, le dry-run
      # nocturne ne laisse rien à lire.
      - name: Artefact du rapport realign
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realign-tmdb-links-${{ github.run_number }}
          path: /tmp/realign-tmdb-links.json
          if-no-files-found: ignore
          retention-days: 14
