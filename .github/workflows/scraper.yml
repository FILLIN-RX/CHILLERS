name: Chiller Scraper & Maintenance

on:
  # Scraping + Maintenance quotidien à 03h00 UTC
  schedule:
    - cron: '0 3 * * *'

  # Déclenchement manuel depuis l'interface GitHub
  workflow_dispatch:
    inputs:
      task:
        description: 'Tâche à exécuter'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'films'
          - 'series'
          - 'animes'
          - 'maintenance'
          - 'link-tmdb'
          - 'keepalive'
          - 'deploy-migration'

jobs:
  scrape-and-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Installation des dépendances Backend
        run: |
          cd backend
          npm ci

      - name: Scraping & Maintenance
        env:
          NODE_ENV: production
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          UQLOAD_API_KEY: ${{ secrets.UQLOAD_API_KEY }}
          DOODSTREAM_API_KEY: ${{ secrets.DOODSTREAM_API_KEY }}
          DOODSTREAM_USER: ${{ secrets.DOODSTREAM_USER }}
          STREAMTAPE_LOGIN: ${{ secrets.STREAMTAPE_LOGIN }}
          STREAMTAPE_KEY: ${{ secrets.STREAMTAPE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          cd backend
          TASK="${{ github.event.inputs.task || 'all' }}"
          echo "=== Lancement de la tâche : $TASK ==="

          case "$TASK" in
            "films")
              npx tsx src/scraping/core/scrape-films.ts
              ;;
            "series")
              npx tsx src/scraping/core/scrape-series.ts
              ;;
            "animes")
              npx tsx src/scraping/core/scrape-animes.ts
              ;;
            "maintenance")
              echo "1/4 Vérification des liens morts..."
              npx tsx src/scraping/maintenance/check-all-links.ts || true
              echo "2/4 Maintenance liens séries..."
              npx tsx src/scraping/maintenance/maintainer.ts || true
              echo "3/4 Organize séries Doodstream..."
              npx tsx src/scraping/maintenance/organize-series.ts || true
              echo "4/4 Sync séries vers MongoDB..."
              npx tsx src/scraping/maintenance/sync-series-to-mongo.ts || true
              ;;
            "link-tmdb")
              npx tsx src/scraping/maintenance/link-movies-tmdb.ts
              npx tsx src/scraping/maintenance/link-series-tmdb.ts
              ;;
            "keepalive")
              npx tsx src/scraping/maintenance/keepalive-uqload.ts
              ;;
            "deploy-migration")
              echo "Migration DoodStream → Uqload..."
              npx tsx src/scripts/migrate-dood-to-uqload.ts || true
              npx tsx src/scripts/upload-uqload.ts --verify || true
              ;;
            "all")
              echo "=== 1/7 Scraping Films ==="
              npx tsx src/scraping/core/scrape-films.ts
              echo "=== 2/7 Scraping Séries ==="
              npx tsx src/scraping/core/scrape-series.ts
              echo "=== 3/7 Scraping Animes ==="
              npx tsx src/scraping/core/scrape-animes.ts
              echo "=== 4/7 Linking TMDB ==="
              npx tsx src/scraping/maintenance/link-movies-tmdb.ts || true
              npx tsx src/scraping/maintenance/link-series-tmdb.ts || true
              echo "=== 5/7 Vérification liens morts ==="
              npx tsx src/scraping/maintenance/check-all-links.ts || true
              echo "=== 6/7 Maintenance liens séries ==="
              npx tsx src/scraping/maintenance/maintainer.ts || true
              echo "=== 7/7 Organize + Sync séries ==="
              npx tsx src/scraping/maintenance/organize-series.ts || true
              npx tsx src/scraping/maintenance/sync-series-to-mongo.ts || true
              ;;
            *)
              echo "Tâche inconnue : $TASK"
              exit 1
              ;;
          esac

      - name: KeepAlive Uqload (dimanche uniquement)
        env:
          NODE_ENV: production
          MONGO_URI: ${{ secrets.MONGO_URI }}
          UQLOAD_API_KEY: ${{ secrets.UQLOAD_API_KEY }}
        run: |
          cd backend
          # En schedule, vérifier que c'est dimanche (jour 7)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DAY=$(date -u +%u)
            if [ "$DAY" != "7" ]; then
              echo "Pas dimanche (jour $DAY), skip keepalive."
              exit 0
            fi
          fi
          echo "=== KeepAlive Uqload ==="
          npx tsx src/scraping/maintenance/keepalive-uqload.ts
