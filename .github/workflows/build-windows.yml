name: Build Flutter Windows App

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Flutter for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Enable Windows Desktop Support
        run: |
          flutter config --enable-windows-desktop

      - name: Build Windows Desktop Executable
        run: |
          cd mobile
          flutter build windows --release

      - name: Archive Windows Release Build
        run: |
          Compress-Archive -Path "mobile/build/windows/x64/runner/Release/*" -DestinationPath "chillers-mobile-windows.zip"

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chillers-Mobile-Windows
          path: chillers-mobile-windows.zip
