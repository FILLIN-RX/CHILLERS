[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

[program:flaresolverr]
command=/opt/flaresolverr/bin/python -m flaresolverr
environment=HOST="127.0.0.1",PORT="8191",LOG_LEVEL="info"
autorestart=true
startretries=10
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chillers-backend]
command=node --max-old-space-size=350 dist/server.js
directory=/app/backend
autorestart=true
startretries=10
startsecs=2
environment=FLARESOLVERR_URL="http://127.0.0.1:8191",FLARESOLVERR_HOST="127.0.0.1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0